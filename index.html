    "Ensembles",
    "D",
    "Injectivité, surjectivité et bijectivité",
    "Soit \\(f:E\\to F\\).\n• Injective : \\(f(x)=f(y)\\Rightarrow x=y\\).\n• Surjective : \\(\\forall y\\in F,\\;\\exists x\\in E,\\;f(x)=y\\).\n• Bijective : injective et surjective, autrement dit \\(\\forall y\\in F,\\;\\exists!x\\in E,\\;f(x)=y\\)."

  [
    "Ensembles",
    "P",
    "Démontrer le binôme de Newton : \( (a+b)^n=\sum_{k=0}^{n}\binom{n}{k}a^k b^{n-k} \)",
    "On raisonne par récurrence sur \\(n\\).\nHérédité : on multiplie l’égalité au rang \\(n\\) par \\(a+b\\), puis on regroupe les termes de même puissance. Le coefficient de \\(a^k b^{n+1-k}\\) devient\n\\[\\binom{n}{k}+\\binom{n}{k-1}=\\binom{n+1}{k},\\]\ngrâce à la formule de Pascal. On obtient ainsi le rang \\(n+1\\)."
  ],
  [
    "Arithmétique",
    "P",
    "Démontrer que \\(\\sqrt{2}\\) est irrationnel",
    "Par l’absurde, supposons \\(\\sqrt{2}=p/q\\), avec \\(p,q\\in\\mathbb Z\\), \\(q\\ne0\\) et \\(\\gcd(p,q)=1\\).\nAlors \\(p^2=2q^2\\), donc \\(p\\) est pair : écrivons \\(p=2k\\). On obtient alors \\(q^2=2k^2\\), donc \\(q\\) est pair.\nC’est contradictoire avec \\(\\gcd(p,q)=1\\)."
  ],
  [
    "Arithmétique",
    "T",
    "Énoncer Bézout et le lemme de Gauss",
    "Bézout. \\(\\gcd(a,b)=1\\iff\\exists(u,v)\\in\\mathbb Z^2,\\;au+bv=1\\).\nGauss. Si \\(a\\mid bc\\) et \\(\\gcd(a,b)=1\\), alors \\(a\\mid c\\)."
  ],
  [
    "Arithmétique",
    "P",
    "Démontrer le lemme de Gauss",
    "Comme \\(\\gcd(a,b)=1\\), Bézout donne \\(au+bv=1\\). En multipliant par \\(c\\) :\n\\[c=acu+bcv.\\]\nOr \\(a\\mid ac\\) et, par hypothèse, \\(a\\mid bc\\). Donc \\(a\\mid c\\)."
  ],
  [
    "Arithmétique",
    "P",
    "Démontrer qu’il existe une infinité de nombres premiers",
    "Par l’absurde, supposons que les nombres premiers soient exactement \\(p_1,\\ldots,p_n\\). Posons\n\\[N=p_1p_2\\cdots p_n+1.\\]\nComme \\(N\\ge2\\), il possède un diviseur premier, nécessairement l’un des \\(p_i\\). Mais alors \\(p_i\\mid N-p_1\\cdots p_n=1\\), contradiction."
  ],
  [
    "Suites",
    "D",
    "Définition de la convergence d’une suite",
    "La suite \\((u_n)\\) converge vers \\(\\ell\\) si\n\\[\\forall\\varepsilon>0,\\;\\exists N\\in\\mathbb N,\\;\\forall n\\ge N,\\quad |u_n-\\ell|\\le\\varepsilon.\\]"
  ],
  [
    "Suites",
    "P",
    "Démontrer : toute suite croissante et majorée converge",
    "Posons \\(\\ell=\\sup\\{u_n:n\\in\\mathbb N\\}\\). Soit \\(\\varepsilon>0\\). Par définition de la borne supérieure, il existe \\(N\\) tel que \\(u_N>\\ell-\\varepsilon\\).\nPour tout \\(n\\ge N\\), la croissance donne\n\\[\\ell-\\varepsilon<u_N\\le u_n\\le\\ell,\\]\ndonc \\(|u_n-\\ell|\\le\\varepsilon\\). Ainsi \\((u_n)\\) converge vers \\(\\ell\\)."
  ],
  [
    "Suites",
    "T",
    "Théorème de Bolzano–Weierstrass",
    "Toute suite réelle bornée admet une suite extraite convergente.\nIdée de preuve : on effectue une dichotomie d’un segment qui contient tous les termes, en conservant à chaque étape une moitié contenant une infinité de termes. On construit ainsi des intervalles emboîtés dont les longueurs tendent vers \\(0\\), puis une extraction convergente."
  ],
  [
    "Suites",
    "T",

  ],

    "Continuité",
    "T",
    "Théorème des valeurs intermédiaires",
    "Si \\(f\\) est continue sur \\([a,b]\\) et si \\(f(a)f(b)\\le0\\), alors\n\\[\\exists c\\in[a,b],\\quad f(c)=0.\\]\nIdée de preuve : dichotomie sur \\([a,b]\\), ou bien on pose \\(c=\\sup\\{x\\in[a,b]:f(x)\\le0\\}\\) lorsque \\(f(a)\\le0\\le f(b)\\)."
  ],
  [
    "Continuité",
    "T",
    "Théorème des bornes atteintes",

  ],
  [

    "La fonction \\(f\\) est dérivable en \\(a\\) si le taux d’accroissement admet une limite finie :\n\\[f'(a)=\\lim_{x\\to a}\\frac{f(x)-f(a)}{x-a}.\\]\nCela équivaut à\n\\[f(x)=f(a)+f'(a)(x-a)+o(x-a).\\]\nEn particulier, \\(f\\) est continue en \\(a\\), car \\(f(x)-f(a)\\to0\\)."
  ],

    "T",
    "Théorème de Rolle",

  ],

    "Une partie \\(F\\subset E\\) est un sous-espace vectoriel si\n\\[0_E\\in F\\quad\\text{et}\\quad\\forall x,y\\in F,\\;\\forall\\lambda,\\mu\\in\\mathbb K,\\;\\lambda x+\\mu y\\in F.\\]"
  ],
  [
    "Algèbre linéaire",
    "D",
    "Famille libre, génératrice et base",
    "• Libre : \\(\\sum_{i=1}^{n}\\lambda_i x_i=0\\Rightarrow\\lambda_1=\\cdots=\\lambda_n=0\\).\n• Génératrice : \\(\\operatorname{Vect}(x_1,\\ldots,x_n)=E\\).\n• Base : famille libre et génératrice ; tout vecteur possède alors une unique décomposition comme combinaison linéaire des vecteurs de la base."
  ],
  [
    "Algèbre linéaire",
    "P",

    "\\((\\Rightarrow)\\) Si \\(f(x)=0=f(0)\\), l’injectivité donne \\(x=0\\).\n\\((\\Leftarrow)\\) Si \\(f(x)=f(y)\\), alors \\(f(x-y)=0\\). Donc \\(x-y\\in\\ker f=\\{0\\}\\), d’où \\(x=y\\)."
  ],
  [
    "Algèbre linéaire",
    "P",
    "Démontrer le théorème du rang",
    "Soit \\( (e_1,\\ldots,e_k)\\) une base de \\(\\ker f\\), que l’on complète en une base \\( (e_1,\\ldots,e_n)\\) de \\(E\\).\nLes vecteurs \\(f(e_{k+1}),\\ldots,f(e_n)\\) forment une base de \\(\\operatorname{Im}f\\). Ainsi\n\\[\\dim E=\\dim\\ker f+\\operatorname{rg}f.\\]"
  ],
  [
    "Algèbre linéaire",
    "T",
    "Formule de Grassmann",
    "Pour deux sous-espaces vectoriels \\(F,G\\) d’un espace de dimension finie :\n\\[\\dim(F+G)=\\dim F+\\dim G-\\dim(F\\cap G).\\]\nPreuve : on applique le théorème du rang à \\( (x,y)\\mapsto x+y\\), de \\(F\\times G\\) dans \\(E\\). Son noyau \\(\\{(x,-x):x\\in F\\cap G\\}\\) est isomorphe à \\(F\\cap G\\)."
  ],
  [
    "Groupes",
    "P",
    "Démontrer le théorème de Lagrange",
    "Soit \\(G\\) un groupe fini et \\(H\\) un sous-groupe. Les classes \\(xH\\) ont toutes \\( |H| \\) éléments, car l’application \\(y\\mapsto xy\\) est bijective. Elles partitionnent \\(G\\).\nAinsi \\(|G|\\) est le produit du nombre de classes par \\(|H|\\), donc \\(|H|\\) divise \\(|G|\\)."
  ],
  [
    "Probabilités",
    "T",
    "Probabilités totales et formule de Bayes",
    "Si \\( (A_i)_{i=1}^{n}\\) est un système complet d’événements :\n\\[P(B)=\\sum_{i=1}^{n}P(B\\mid A_i)P(A_i).\\]\nPour \\(P(B)>0\\), la formule de Bayes s’écrit\n\\[P(A_j\\mid B)=\\frac{P(B\\mid A_j)P(A_j)}{P(B)}.\\]"
  ],
  [
    "Probabilités",
    "P",
    "Démontrer l’inégalité de Bienaymé–Tchebychev",
    "Pour \\(\\varepsilon>0\\) :\n\\[P(|X-\\mathbb E(X)|\\ge\\varepsilon)\\le\\frac{\\operatorname{Var}(X)}{\\varepsilon^2}.\\]\nPreuve : on applique l’inégalité de Markov à la variable positive \\((X-\\mathbb E(X))^2\\) :\n\\[P((X-\\mathbb E(X))^2\\ge\\varepsilon^2)\\le\\frac{\\mathbb E[(X-\\mathbb E(X))^2]}{\\varepsilon^2}=\\frac{\\operatorname{Var}(X)}{\\varepsilon^2}.\\]"
  ],
  [
    "Probabilités",
    "P",
    "Espérance et variance d’une loi binomiale",
    "Si \\(X\\sim\\mathcal B(n,p)\\), on peut écrire \\(X=X_1+\\cdots+X_n\\), où les \\(X_i\\) sont des variables de Bernoulli indépendantes de paramètre \\(p\\).\nPar linéarité de l’espérance et additivité des variances indépendantes :\n\\[\\mathbb E(X)=np,\\qquad\\operatorname{Var}(X)=np(1-p).\\]"
  ],
  [
    "Informatique",
    "D",
    "Définition de \\(f=O(g)\\) et complexité",
    "On écrit \\(f=O(g)\\) s’il existe \\(C>0\\) et \\(n_0\\) tels que\n\\[\\forall n\\ge n_0,\\quad |f(n)|\\le C|g(n)|.\\]\nLa complexité mesure le nombre d’opérations élémentaires, généralement dans le pire cas, en fonction de la taille de l’entrée."
  ],
  [
    "Informatique",
    "P",
    "Terminaison et correction de l’algorithme d’Euclide",
    "Terminaison : le reste est un entier positif ou nul strictement décroissant ; il constitue un variant.\nCorrection : on utilise l’invariant\n\\[\\operatorname{pgcd}(a,b)=\\operatorname{pgcd}(b,a\\bmod b),\\]\nqui découle de la division euclidienne \\(a=bq+r\\)."
  ]
];
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\'":"&#39;"}[m])),TY={D:"Définition",T:"Théorème",P:"Démonstration"};
let S;try{S=JSON.parse(localStorage.getItem("rd"))}catch(e){}S=S||{c:{},x:[],l:{}};
let tab=0,Q=[],show=false,built=false,F="*",mathReady=false;
const save=()=>{try{localStorage.setItem("rd",JSON.stringify(S))}catch(e){}};
const today=()=>{const d=new Date();return Math.floor((d-d.getTimezoneOffset()*6e4)/864e5)};
const all=()=>D.map((c,i)=>({id:"d"+i,ch:c[0],ty:c[1],q:c[2],a:c[3]})).concat(S.x);
const st=c=>{const s=S.c[c.id];return!s?0:s.i>=21?2:1};
const chs=()=>[...new Set(all().map(c=>c.ch))];
function nx(o,q){const s=Object.assign({e:2.5,i:0,r:0,l:0},o);
 if(q==1){s.r=0;s.i=1;s.l++;s.e=Math.max(1.3,s.e-.2)}
 else{if(q==3){s.e=Math.max(1.3,s.e-.15);s.i=s.r?Math.max(2,Math.round(s.i*1.2)):1}else{s.e+=.1;s.i=s.r==0?2:s.r==1?6:Math.round(s.i*s.e)}s.r++}
 return s}
function build(){const t=today(),L=all().filter(c=>F=="*"||c.ch==F),n=(S.l[t]||{}).n||0;
 Q=L.filter(c=>S.c[c.id]&&S.c[c.id].d<=t).sort((a,b)=>S.c[a.id].d-S.c[b.id].d).concat(L.filter(c=>!S.c[c.id]).slice(0,Math.max(0,6-n)));built=true}
function grade(q){const c=Q.shift(),t=today(),nw=!S.c[c.id],s=nx(S.c[c.id],q);s.d=t+(q==1?0:s.i);S.c[c.id]=s;
 const l=S.l[t]=S.l[t]||{r:0,n:0};l.r++;if(nw)l.n++;if(q==1)Q.push(c);save();show=false;render()}
function streak(){let n=0,d=today();if(!(S.l[d]&&S.l[d].r))d--;while(S.l[d]&&S.l[d].r){n++;d--}return n}
function mathTypeset(){if(!mathReady||!window.MathJax?.typesetPromise)return;const target=$("#v");try{MathJax.typesetClear?.([target]);MathJax.typesetPromise([target]).catch(()=>{})}catch(e){}}
window.addEventListener("load",()=>{if(window.MathJax?.typesetPromise){mathReady=true;mathTypeset()}});
function rv(){if(!built)build();
 const sel=`<div class="filter-row"><label for="fl">CHAPITRE À RÉVISER</label><div class="select-wrap"><select id="fl" onchange="F=this.value;built=false;show=false;render()"><option value="*">Tous les chapitres</option>${chs().map(c=>`<option value="${E(c)}"${c==F?" selected":""}>${E(c)}</option>`).join("")}</select></div></div>`;
 if(!Q.length){const t=today(),n=all().filter(c=>S.c[c.id]&&S.c[c.id].d==t+1).length;
  return sel+`<div class="empty-state"><div class="empty-icon">✓</div><h2>Séance terminée</h2><p>${n?`Tu as terminé pour aujourd’hui. ${n} carte${n>1?"s":""} à revoir demain.`:"Aucune carte prévue demain. Profite de cette avance."}</p></div>`}
 const c=Q[0],s=S.c[c.id];
 let h=sel+`<article class="study-card"><div class="card-meta"><span class="chapter-chip">${E(c.ch)}</span><span class="type-chip">${TY[c.ty]}</span><span class="counter-chip">${Q.length} restante${Q.length>1?"s":""}</span></div><h2 class="study-question">${E(c.q)}</h2>`;
 if(!show)h+=`<p class="hint">${c.ty=="P"?"Refais la démonstration sur papier avant de consulter la correction.":"Essaie de retrouver la réponse sans regarder ton cours."}</p><button class="primary-btn" onclick="rev()">Afficher la correction <span class="arrow">→</span></button><p class="keyboard-hint">Raccourci : <span class="key">Espace</span> pour révéler</p>`;
 else h+=`<div class="answer">${E(c.a)}</div><div class="grade-grid">${[["Raté",1,"ko"],["Hésité",3,"mid"],["Réussi",5,"ok"]].map(([n,q,k],i)=>`<button class="grade-btn ${k}" onclick="grade(${q})"><b>${n}</b><small>${q==1?"à revoir":nx(s,q).i+" jour(s)"} · ${i+1}</small></button>`).join("")}</div><p class="keyboard-hint"><span class="key">1</span> Raté &nbsp; <span class="key">2</span> Hésité &nbsp; <span class="key">3</span> Réussi</p>`;
 return h+`</article>`}
const rev=()=>{show=true;render()};
function lib(){const A=all();return `<div class="library-head"><div><div class="eyebrow">Bibliothèque</div><div style="font:500 1.55rem Georgia,serif">Toutes tes cartes</div></div><span>${A.length} cartes</span></div><details class="add-card"><summary>Créer une carte personnelle</summary><div class="add-form"><div class="field"><label for="ac">CHAPITRE</label><input id="ac" value="Perso" aria-label="Chapitre"></div><div class="field"><label for="at">TYPE DE CARTE</label><select id="at"><option value="D">Définition</option><option value="T">Théorème</option><option value="P">Démonstration</option></select></div><div class="field"><label for="aq">QUESTION / ÉNONCÉ</label><input id="aq" placeholder="Ex. : Démontrer que…"></div><div class="field"><label for="aa">RÉPONSE / CORRECTION</label><textarea id="aa" rows="5" placeholder="Tu peux écrire les formules en LaTeX : \\( ... \\) ou \\[ ... \\]"></textarea></div><button class="primary-btn" style="margin-top:2px" onclick="addc()">Ajouter à ma bibliothèque <span class="arrow">＋</span></button><p class="hint">Les formules entre délimiteurs LaTeX seront affichées automatiquement.</p></div></details>`
 +chs().map(ch=>`<section class="chapter-section"><h3 class="chapter-title">${E(ch)}</h3>`+A.filter(c=>c.ch==ch).map(c=>`<details class="library-item"><summary><i class="status-dot d${st(c)}"></i><span class="summary-title">${E(c.q)}</span><span class="type-tag">${TY[c.ty]}</span><span class="chevron">⌄</span></summary><div class="library-answer">${E(c.a)}</div></details>`).join("")+`</section>`).join("")}
function addc(){const q=$("#aq").value.trim(),a=$("#aa").value.trim();if(!q||!a){alert("Ajoute une question et une réponse.");return}S.x.push({id:"x"+Date.now(),ch:$("#ac").value.trim()||"Perso",ty:$("#at").value,q,a});save();built=false;render()}
function prog(){const A=all(),n=[0,0,0],t=today();A.forEach(c=>n[st(c)]++);
 const due=A.filter(c=>S.c[c.id]&&S.c[c.id].d<=t).length,tot=Object.values(S.l).reduce((s,l)=>s+l.r,0);
 let days="";for(let i=13;i>=0;i--){const r=(S.l[t-i]||{}).r||0;days+=`<div class="day-cell" title="${r} révision${r>1?"s":""}"><span style="height:${Math.min(100,r*8)}%"></span></div>`}
 const bar=(m,l,z)=>{const total=m+l+z||1;return `<div class="progress-bar"><i class="ok" style="width:${m/total*100}%"></i><i class="mid" style="width:${l/total*100}%"></i><i class="new" style="width:${z/total*100}%"></i></div>`};
 return `<div class="eyebrow">Tableau de bord</div><div style="font:500 1.65rem Georgia,serif;margin-bottom:18px">Ta progression</div><div class="stats-grid"><div class="stat-card"><b class="stat-value">${due}</b><span class="stat-label">Cartes à revoir</span></div><div class="stat-card"><b class="stat-value">${streak()}</b><span class="stat-label">Jours consécutifs</span></div><div class="stat-card"><b class="stat-value">${tot}</b><span class="stat-label">Révisions effectuées</span></div></div><section class="progress-card"><div class="progress-title"><span>Maîtrise globale</span><span>${Math.round(n[2]/A.length*100||0)} % maîtrisé</span></div>${bar(n[2],n[1],n[0])}<div class="progress-legend"><span><i class="legend-dot" style="background:var(--success)"></i>${n[2]} maîtrisées</span><span><i class="legend-dot" style="background:var(--warning)"></i>${n[1]} en cours</span><span><i class="legend-dot" style="background:var(--line)"></i>${n[0]} nouvelles</span></div></section><section class="progress-card"><div class="progress-title"><span>Activité récente</span><span>14 derniers jours</span></div><div class="days">${days}</div><div class="day-labels"><span>Il y a 14 jours</span><span>Aujourd’hui</span></div></section><section class="progress-card"><div class="progress-title"><span>Maîtrise par chapitre</span><span>${A.length} cartes</span></div>${chs().map(ch=>{const L=A.filter(c=>c.ch==ch),m=L.filter(c=>st(c)==2).length,l=L.filter(c=>st(c)==1).length;return `<div class="chapter-row"><span>${E(ch)}</span>${bar(m,l,L.length-m-l)}<span class="chapter-count">${m}/${L.length}</span></div>`}).join("")}</section><button class="reset-btn" onclick="if(confirm('Effacer toute la progression et les cartes personnelles ?')){S={c:{},x:[],l:{}};save();built=false;render()}">Réinitialiser toutes les données</button>`}
function render(){const names=["Réviser","Cartes","Progrès"];$("#t").innerHTML=names.map((n,i)=>`<button type="button" class="${i==tab?"on":""}" aria-current="${i==tab?"page":"false"}" onclick="tab=${i};render()">${n}</button>`).join("");$("#v").innerHTML=[rv,lib,prog][tab]();mathTypeset()}
const savedTheme=localStorage.getItem("rd-theme");if(savedTheme==="dark"||savedTheme==="light")document.documentElement.dataset.theme=savedTheme;
$("#themeToggle").addEventListener("click",()=>{const next=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=next;localStorage.setItem("rd-theme",next);$("#themeToggle").textContent=next==="dark"?"☼":"◐"});
$("#themeToggle").textContent=document.documentElement.dataset.theme==="dark"?"☼":"◐";
onkeydown=e=>{if(tab||!Q.length||e.target.matches("input,textarea,select"))return;if(!show&&(e.key==" "||e.key=="Enter")){e.preventDefault();rev()}else if(show&&"123".includes(e.key)&&e.key.length==1)grade([1,3,5][+e.key-1])};
render();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => console.warn("Service worker non enregistré :", err));
  });
}
</script></body></html>
